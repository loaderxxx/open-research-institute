<svg xmlns="http://www.w3.org/2000/svg" width="480" height="957" viewBox="0 0 480 957" role="img" aria-labelledby="title description" lang="ru" xml:lang="ru"><title id="title">От мнений к выполненному решению</title><desc id="description">На примере школьного двора люди предлагают деревья, спортивную площадку или тихую зону. Затем обсуждают последствия, стоимость и тех, кого ещё надо услышать. До итогового решения выясняют, у кого есть полномочия. После решения проверяют ответственность, выполнение и обратную связь. Участие должно быть добровольным, с возможностью высказаться разным людям.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#285b43" stroke-width="1.5"/></marker></defs><rect width="480" height="957" fill="#f4f1e9"/><text x="24" y="35" font-family="Arial, sans-serif" font-size="19" fill="#172522" text-anchor="start"><tspan x="24" dy="0">ORI / РИСУНОК К РАЗБОРУ</tspan></text><rect x="16" y="60" width="448" height="210" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="94" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="103" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">1</tspan></text><text x="76" y="104" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Услышим разные мнения</tspan></text><text x="240" y="149" font-family="Arial, sans-serif" font-size="24" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Деревья? Спортивная площадка?</tspan><tspan x="240" dy="31.200000000000003">Тихое место для отдыха?</tspan></text><circle cx="100" cy="210" r="12" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M80 258 Q80 228 100 228 Q120 228 120 258" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><circle cx="240" cy="210" r="12" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M220 258 Q220 228 240 228 Q260 228 260 258" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><circle cx="380" cy="210" r="12" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M360 258 Q360 228 380 228 Q400 228 400 258" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><rect x="16" y="281" width="448" height="185" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="315" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="324" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">2</tspan></text><text x="76" y="325" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Сравним предложения</tspan></text><text x="240" y="382" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Кому поможет? Сколько стоит?</tspan><tspan x="240" dy="32.5">Кого забыли спросить?</tspan></text><rect x="16" y="492" width="448" height="185" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="526" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="535" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">3</tspan></text><text x="76" y="536" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Кто вправе решить?</tspan></text><rect x="45" y="571" width="390" height="66" rx="14" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><text x="240" y="613" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Полномочия задают правила.</tspan></text><rect x="16" y="703" width="448" height="195" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="737" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="746" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">4</tspan></text><text x="76" y="747" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Проверим выполнение</tspan></text><text x="240" y="798" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Кто отвечает? Что сделано?</tspan><tspan x="240" dy="32.5">Почему выбрали этот вариант?</tspan></text><text x="24" y="932" font-family="Arial, sans-serif" font-size="24" fill="#172522" text-anchor="start"><tspan x="24" dy="0">Схема, не фотография.</tspan></text></svg>
