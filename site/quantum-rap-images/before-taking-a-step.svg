<svg xmlns="http://www.w3.org/2000/svg" width="480" height="948" viewBox="0 0 480 948" role="img" aria-labelledby="title description" lang="ru" xml:lang="ru"><title id="title">Робот: заметить, спланировать, проверить</title><desc id="description">Датчик помогает заметить препятствие. На условной клетчатой карте маршрут огибает стул от старта до цели. После действия система снова получает данные и проверяет путь; при опасности может потребоваться остановка. Человек оценивает работу системы в испытаниях и задаёт требования безопасности. Это упрощённый цикл: схема не обещает, что человек вручную одобряет каждое движение любого робота.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#285b43" stroke-width="1.5"/></marker></defs><rect width="480" height="948" fill="#f4f1e9"/><text x="24" y="35" font-family="Arial, sans-serif" font-size="19" fill="#172522" text-anchor="start"><tspan x="24" dy="0">ORI / РИСУНОК К РАЗБОРУ</tspan></text><rect x="16" y="60" width="448" height="175" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="94" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="103" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">1</tspan></text><text x="76" y="104" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Заметить препятствие</tspan></text><rect x="40" y="139" width="58" height="55" rx="14" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><circle cx="54" cy="200" r="7" fill="#172522" stroke="#285b43" stroke-width="2"/><circle cx="83" cy="200" r="7" fill="#172522" stroke="#285b43" stroke-width="2"/><path d="M106 161 L259 161" fill="none" stroke="#285b43" stroke-width="3" stroke-dasharray="7 6"/><rect x="280" y="140" width="46" height="68" rx="2" fill="#eee5dc" stroke="#855029" stroke-width="2"/><text x="382" y="174" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="middle"><tspan x="382" dy="0">Стул</tspan></text><rect x="16" y="253" width="448" height="255" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="287" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="296" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">2</tspan></text><text x="76" y="297" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Выбрать обход</tspan></text><path d="M66 334 L66 455" fill="none" stroke="#c9cabe" stroke-width="3"/><path d="M149 334 L149 455" fill="none" stroke="#c9cabe" stroke-width="3"/><path d="M232 334 L232 455" fill="none" stroke="#c9cabe" stroke-width="3"/><path d="M315 334 L315 455" fill="none" stroke="#c9cabe" stroke-width="3"/><path d="M398 334 L398 455" fill="none" stroke="#c9cabe" stroke-width="3"/><path d="M66 334 L398 334" fill="none" stroke="#c9cabe" stroke-width="3"/><path d="M66 394 L398 394" fill="none" stroke="#c9cabe" stroke-width="3"/><path d="M66 454 L398 454" fill="none" stroke="#c9cabe" stroke-width="3"/><rect x="220" y="364" width="46" height="62" rx="2" fill="#eee5dc" stroke="#855029" stroke-width="2"/><path d="M85 424 L169 424 L169 346 L315 346 L315 424 L388 424" fill="none" stroke="#285b43" stroke-width="4" marker-end="url(#arrow)"/><circle cx="85" cy="424" r="9" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><text x="85" y="491" font-family="Arial, sans-serif" font-size="24" fill="#172522" text-anchor="middle"><tspan x="85" dy="0">Старт</tspan></text><text x="385" y="491" font-family="Arial, sans-serif" font-size="24" fill="#172522" text-anchor="middle"><tspan x="385" dy="0">Цель</tspan></text><rect x="16" y="526" width="448" height="190" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="560" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="569" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">3</tspan></text><text x="76" y="570" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Действовать и проверить</tspan></text><text x="240" y="621" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Обстановка изменилась?</tspan><tspan x="240" dy="32.5">Остановиться и оценить снова.</tspan></text><rect x="16" y="734" width="448" height="155" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="768" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="777" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">4</tspan></text><text x="76" y="778" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Проверка человеком</tspan></text><text x="240" y="832" font-family="Arial, sans-serif" font-size="24" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Испытания до работы с людьми</tspan></text><text x="24" y="923" font-family="Arial, sans-serif" font-size="24" fill="#172522" text-anchor="start"><tspan x="24" dy="0">Схема, не фотография.</tspan></text></svg>
