<svg xmlns="http://www.w3.org/2000/svg" width="480" height="870" viewBox="0 0 480 870" role="img" aria-labelledby="title description" lang="ru" xml:lang="ru"><title id="title">Уверенный ответ нужно проверять</title><desc id="description">Первая панель показывает заявленную уверенность 90 процентов. Во второй изображены десять вымышленных проверок: девять кружков с галочками и один квадрат с крестом. Форма и знак повторяют смысл цвета. Это учебная иллюстрация, не статистика исследования. Уверенность имеет смысл проверять по многим похожим случаям; она не доказывает истинность отдельного ответа.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#285b43" stroke-width="1.5"/></marker></defs><rect width="480" height="870" fill="#f4f1e9"/><text x="24" y="35" font-family="Arial, sans-serif" font-size="19" fill="#172522" text-anchor="start"><tspan x="24" dy="0">ORI / РИСУНОК К РАЗБОРУ</tspan></text><rect x="16" y="60" width="448" height="180" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="94" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="103" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">1</tspan></text><text x="76" y="104" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">ИИ говорит уверенно</tspan></text><rect x="48" y="141" width="384" height="65" rx="14" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><text x="240" y="184" font-family="Arial, sans-serif" font-size="29" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">«Уверенность: 90%»</tspan></text><rect x="16" y="258" width="448" height="300" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="292" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="301" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">2</tspan></text><text x="76" y="302" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Проверим ответы</tspan></text><circle cx="72" cy="376" r="25" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M63 376 l6 7 13 -17" fill="none" stroke="#285b43" stroke-width="4"/><circle cx="156" cy="376" r="25" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M147 376 l6 7 13 -17" fill="none" stroke="#285b43" stroke-width="4"/><circle cx="240" cy="376" r="25" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M231 376 l6 7 13 -17" fill="none" stroke="#285b43" stroke-width="4"/><circle cx="324" cy="376" r="25" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M315 376 l6 7 13 -17" fill="none" stroke="#285b43" stroke-width="4"/><circle cx="408" cy="376" r="25" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M399 376 l6 7 13 -17" fill="none" stroke="#285b43" stroke-width="4"/><circle cx="72" cy="450" r="25" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M63 450 l6 7 13 -17" fill="none" stroke="#285b43" stroke-width="4"/><circle cx="156" cy="450" r="25" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M147 450 l6 7 13 -17" fill="none" stroke="#285b43" stroke-width="4"/><circle cx="240" cy="450" r="25" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M231 450 l6 7 13 -17" fill="none" stroke="#285b43" stroke-width="4"/><circle cx="324" cy="450" r="25" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M315 450 l6 7 13 -17" fill="none" stroke="#285b43" stroke-width="4"/><rect x="383" y="425" width="50" height="50" rx="3" fill="#eee5dc" stroke="#855029" stroke-width="2"/><path d="M399 441 L417 459" fill="none" stroke="#855029" stroke-width="3"/><path d="M399 459 L417 441" fill="none" stroke="#855029" stroke-width="3"/><text x="240" y="518" font-family="Arial, sans-serif" font-size="29" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">9 верных, 1 ошибка</tspan></text><rect x="16" y="576" width="448" height="235" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="610" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="619" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">3</tspan></text><text x="76" y="620" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Что говорит пример</tspan></text><text x="240" y="680" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Это вымышленные ответы,</tspan><tspan x="240" dy="32.5">а не данные исследования.</tspan></text><text x="240" y="763" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Один ответ не гарантирован.</tspan></text><text x="24" y="845" font-family="Arial, sans-serif" font-size="24" fill="#172522" text-anchor="start"><tspan x="24" dy="0">Схема, не фотография.</tspan></text></svg>
