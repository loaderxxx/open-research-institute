<svg xmlns="http://www.w3.org/2000/svg" width="480" height="960" viewBox="0 0 480 960" role="img" aria-labelledby="title description" lang="ru" xml:lang="ru"><title id="title">Три направления исследований, а не перенос личности</title><desc id="description">Верхняя независимая ветвь: из интервью строят модель, предсказывающую ответы в определённых задачах. Средняя: для небольшого участка зрительной коры мыши изучают связи и активность; схема узлов условна. Нижняя: исследовательский нейроинтерфейс помогает живому человеку, например управлять курсором. Ветви не являются этапами загрузки сознания. Перенос субъективного опыта в компьютер не доказан.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#285b43" stroke-width="1.5"/></marker></defs><rect width="480" height="960" fill="#f4f1e9"/><text x="24" y="35" font-family="Arial, sans-serif" font-size="19" fill="#172522" text-anchor="start"><tspan x="24" dy="0">ORI / РИСУНОК К РАЗБОРУ</tspan></text><rect x="16" y="60" width="448" height="225" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="94" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="103" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">1</tspan></text><text x="76" y="104" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Интервью → модель ответов</tspan></text><circle cx="65" cy="143" r="12" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M45 191 Q45 161 65 161 Q85 161 85 191" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M99 175 L170 175" fill="none" stroke="#285b43" stroke-width="3" marker-end="url(#arrow)"/><rect x="188" y="139" width="237" height="73" rx="14" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><text x="306" y="170" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="middle"><tspan x="306" dy="0">Предсказанный</tspan><tspan x="306" dy="32.5">ответ</tspan></text><text x="240" y="255" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Не сам человек</tspan></text><rect x="16" y="303" width="448" height="240" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="337" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="346" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">2</tspan></text><text x="76" y="347" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Участок мозга → связи</tspan></text><path d="M65 410 L105 453" fill="none" stroke="#285b43" stroke-width="3"/><path d="M105 453 L145 395" fill="none" stroke="#285b43" stroke-width="3"/><path d="M145 395 L190 442" fill="none" stroke="#285b43" stroke-width="3"/><circle cx="65" cy="410" r="9" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><circle cx="105" cy="453" r="9" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><circle cx="145" cy="395" r="9" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><circle cx="190" cy="442" r="9" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M211 426 L264 426" fill="none" stroke="#285b43" stroke-width="3" marker-end="url(#arrow)"/><text x="348" y="418" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="middle"><tspan x="348" dy="0">Карта</tspan><tspan x="348" dy="35.1">связей</tspan></text><text x="240" y="510" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Малый участок коры мыши</tspan></text><rect x="16" y="561" width="448" height="245" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="595" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="604" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">3</tspan></text><text x="76" y="605" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Человек → нейроинтерфейс</tspan></text><circle cx="65" cy="658" r="12" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M45 706 Q45 676 65 676 Q85 676 85 706" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M101 691 L184 691" fill="none" stroke="#285b43" stroke-width="3" marker-end="url(#arrow)"/><rect x="209" y="641" width="214" height="91" rx="14" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M288 660 l0 46 13 -12 15 8 7 -12 -15 -9Z" fill="#285b43"/><text x="240" y="773" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Помощь живому человеку</tspan></text><text x="240" y="862" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Три разных направления.</tspan><tspan x="240" dy="32.5">Перенос сознания не доказан.</tspan></text><text x="24" y="935" font-family="Arial, sans-serif" font-size="24" fill="#172522" text-anchor="start"><tspan x="24" dy="0">Схема, не фотография.</tspan></text></svg>
