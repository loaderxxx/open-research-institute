<svg xmlns="http://www.w3.org/2000/svg" width="480" height="885" viewBox="0 0 480 885" role="img" aria-labelledby="title description" lang="ru" xml:lang="ru"><title id="title">Две щели: точки и полосы</title><desc id="description">Свет направляют на перегородку с двумя щелями, за ней находится экран. Сначала видны редкие отдельные точки. После многих событий при согласованных неразличимых альтернативах появляется полосатое распределение. Если прибор надёжно сохраняет информацию о пути, исходные интерференционные полосы исчезают. Расположение точек условное, это не данные опыта и не изображение пути частицы.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#285b43" stroke-width="1.5"/></marker></defs><rect width="480" height="885" fill="#f4f1e9"/><text x="24" y="35" font-family="Arial, sans-serif" font-size="19" fill="#172522" text-anchor="start"><tspan x="24" dy="0">ORI / РИСУНОК К РАЗБОРУ</tspan></text><rect x="16" y="60" width="448" height="240" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="94" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="103" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">1</tspan></text><text x="76" y="104" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Как устроен опыт</tspan></text><rect x="40" y="155" width="48" height="50" rx="14" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><text x="64" y="242" font-family="Arial, sans-serif" font-size="26" fill="#172522" text-anchor="middle"><tspan x="64" dy="0">Свет</tspan></text><path d="M98 180 L167 180" fill="none" stroke="#285b43" stroke-width="3" marker-end="url(#arrow)"/><path d="M190 130 L190 158" fill="none" stroke="#285b43" stroke-width="3"/><path d="M190 171 L190 188" fill="none" stroke="#285b43" stroke-width="3"/><path d="M190 201 L190 235" fill="none" stroke="#285b43" stroke-width="3"/><text x="187" y="270" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="middle"><tspan x="187" dy="0">Две щели</tspan></text><rect x="340" y="125" width="82" height="112" rx="14" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><text x="381" y="270" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="middle"><tspan x="381" dy="0">Экран</tspan></text><text x="232" y="164" font-family="Arial, sans-serif" font-size="24" fill="#172522" text-anchor="middle"><tspan x="232" dy="0">?</tspan><tspan x="232" dy="31.200000000000003">Путь</tspan></text><rect x="16" y="318" width="448" height="260" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="352" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="361" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">2</tspan></text><text x="76" y="362" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Много отдельных событий</tspan></text><rect x="40" y="402" width="108" height="110" rx="14" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><circle cx="57" cy="421" r="3" fill="#172522" stroke="#172522" stroke-width="2"/><circle cx="94" cy="440" r="3" fill="#172522" stroke="#172522" stroke-width="2"/><circle cx="70" cy="492" r="3" fill="#172522" stroke="#172522" stroke-width="2"/><circle cx="125" cy="470" r="3" fill="#172522" stroke="#172522" stroke-width="2"/><circle cx="122" cy="417" r="3" fill="#172522" stroke="#172522" stroke-width="2"/><circle cx="61" cy="465" r="3" fill="#172522" stroke="#172522" stroke-width="2"/><path d="M165 453 L220 453" fill="none" stroke="#285b43" stroke-width="3" marker-end="url(#arrow)"/><rect x="242" y="402" width="194" height="110" rx="14" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><circle cx="255" cy="414" r="2.5" fill="#285b43" stroke="#285b43" st