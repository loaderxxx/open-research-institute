span></text><rect x="16" y="596" width="448" height="230" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="630" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="639" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">3</tspan></text><text x="76" y="640" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Если путь записан</tspan></text><rect x="40" y="674" width="150" height="64" rx="14" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><text x="115" y="715" font-family="Arial, sans-serif" font-size="26" fill="#172522" text-anchor="middle"><tspan x="115" dy="0">Детектор</tspan></text><path d="M205 706 L252 706" fill="none" stroke="#285b43" stroke-width="3" marker-end="url(#arrow)"/><rect x="272" y="674" width="164" height="64" rx="14" fill="#eee5dc" stroke="#855029" stroke-width="2"/><text x="354" y="704" font-family="Arial, sans-serif" font-size="24" fill="#172522" text-anchor="middle"><tspan x="354" dy="0">Исходных</tspan><tspan x="354" dy="31.200000000000003">полос нет</tspan></text><text x="40" y="787" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="start"><tspan x="40" dy="0">Важен прибор, а не взгляд.</tspan></text><text x="24" y="860" font-family="Arial, sans-serif" font-size="24" fill="#172522" text-anchor="start"><tspan x="24" dy="0">Схема, не фотография.</tspan></text></svg>
