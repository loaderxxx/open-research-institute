<svg xmlns="http://www.w3.org/2000/svg" width="480" height="885" viewBox="0 0 480 885" role="img" aria-labelledby="title description" lang="ru" xml:lang="ru"><title id="title">Совместное действие: как проверить результат</title><desc id="description">Панель А показывает участников с общим ритмом, панель Б — с другим ритмом. Для сравнения надо заранее определить, что измеряется: ответы анкеты, помощь или выполнение общей задачи. Результат может зависеть от прежних отношений, опыта и условий; требуются контроль и повторения. Из схемы не следует, что любой ритуал делает любую группу дружнее. Каждый участник вправе отказаться.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#285b43" stroke-width="1.5"/></marker></defs><rect width="480" height="885" fill="#f4f1e9"/><text x="24" y="35" font-family="Arial, sans-serif" font-size="19" fill="#172522" text-anchor="start"><tspan x="24" dy="0">ORI / РИСУНОК К РАЗБОРУ</tspan></text><rect x="16" y="60" width="448" height="255" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="94" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="103" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">1</tspan></text><text x="76" y="104" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Разные условия участия</tspan></text><text x="131" y="153" font-family="Arial, sans-serif" font-size="26" fill="#172522" text-anchor="middle"><tspan x="131" dy="0">Группа А</tspan></text><text x="350" y="153" font-family="Arial, sans-serif" font-size="26" fill="#172522" text-anchor="middle"><tspan x="350" dy="0">Группа Б</tspan></text><circle cx="88" cy="185" r="12" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M68 233 Q68 203 88 203 Q108 203 108 233" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><circle cx="163" cy="185" r="12" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M143 233 Q143 203 163 203 Q183 203 183 233" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><circle cx="313" cy="185" r="12" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M293 233 Q293 203 313 203 Q333 203 333 233" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><circle cx="388" cy="185" r="12" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M368 233 Q368 203 388 203 Q408 203 408 233" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M70 213 L50 193" fill="none" stroke="#285b43" stroke-width="3"/><path d="M145 213 L125 193" fill="none" stroke="#285b43" stroke-width="3"/><path d="M295 213 L275 193" fill="none" stroke="#285b43" stroke-width="3"/><path d="M405 213 L425 233" fill="none" stroke="#285b43" stroke-width="3"/><text x="131" y="279" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="middle"><tspan x="131" dy="0">Общий ритм</tspan></text><text x="350" y="279" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="middle"><tspan x="350" dy="0">Другой ритм</tspan></text><rect x="16" y="333" width="448" height="235" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="367" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="376" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">2</tspan></text><text x="76" y="377" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Сравним показатели</tspan></text><rect x="49" y="416" width="382" height="64" rx="14" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><text x="240" y="458" font-family="Arial, sans-serif" font-size="23" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Что назовём сотрудничеством?</tspan></text><text x="240" y="531" font-family="Arial, sans-serif" font-size="23" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Анкета? Помощь? Общая задача?</tspan></text><rect x="16" y="586" width="448" height="240" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="620" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="629" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">3</tspan></text><text x="76" y="630" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Осторожно с выводом</tspan></text><text x="240" y="685" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Влиять могут опыт и условия.</tspan><tspan x="240" dy="32.5">Нужны повторные проверки.</tspan></text><text x="240" y="779" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Можно отказаться от участия.</tspan></text><text x="24" y="860" font-family="Arial, sans-serif" font-size="24" fill="#172522" text-anchor="start"><tspan x="24" dy="0">Схема, не фотография.</tspan></text></svg>
