<svg xmlns="http://www.w3.org/2000/svg" width="480" height="920" viewBox="0 0 480 920" role="img" aria-labelledby="title description" lang="ru" xml:lang="ru"><title id="title">Валентные кварки и электрический заряд</title><desc id="description">Для протона валентный состав uud даёт сумму электрических зарядов две трети плюс две трети минус одна треть, то есть плюс один. Для нейтрона udd сумма равна нулю. Полное квантовое состояние включает глюоны и море кварк-антикварковых пар. Их число и движение эта схема не изображает. Волнистая линия обозначает глюоны условно; q и q с чертой — кварк и антикварк.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#285b43" stroke-width="1.5"/></marker></defs><rect width="480" height="920" fill="#f4f1e9"/><text x="24" y="35" font-family="Arial, sans-serif" font-size="19" fill="#172522" text-anchor="start"><tspan x="24" dy="0">ORI / РИСУНОК К РАЗБОРУ</tspan></text><rect x="16" y="60" width="448" height="270" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="94" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="103" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">1</tspan></text><text x="76" y="104" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Протон: заряд +1</tspan></text><circle cx="100" cy="180" r="32" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><text x="100" y="190" font-family="Arial, sans-serif" font-size="32" fill="#172522" text-anchor="middle"><tspan x="100" dy="0">u</tspan></text><text x="100" y="244" font-family="Arial, sans-serif" font-size="28" fill="#172522" text-anchor="middle"><tspan x="100" dy="0">+2/3</tspan></text><circle cx="240" cy="180" r="32" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><text x="240" y="190" font-family="Arial, sans-serif" font-size="32" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">u</tspan></text><text x="240" y="244" font-family="Arial, sans-serif" font-size="28" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">+2/3</tspan></text><circle cx="380" cy="180" r="32" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><text x="380" y="190" font-family="Arial, sans-serif" font-size="32" fill="#172522" text-anchor="middle"><tspan x="380" dy="0">d</tspan></text><text x="380" y="244" font-family="Arial, sans-serif" font-size="28" fill="#172522" text-anchor="middle"><tspan x="380" dy="0">−1/3</tspan></text><text x="240" y="300" font-family="Arial, sans-serif" font-size="28" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">2/3 + 2/3 − 1/3 = 1</tspan></text><rect x="16" y="348" width="448" height="270" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="382" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="391" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">2</tspan></text><text x="76" y="392" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Нейтрон: заряд 0</tspan></text><circle cx="100" cy="468" r="32" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><text x="100" y="478" font-family="Arial, sans-serif" font-size="32" fill="#172522" text-anchor="middle"><tspan x="100" dy="0">u</tspan></text><text x="100" y="532" font-family="Arial, sans-serif" font-size="28" fill="#172522" text-anchor="middle"><tspan x="100" dy="0">+2/3</tspan></text><circle cx="240" cy="468" r="32" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><text x="240" y="478" font-family="Arial, sans-serif" font-size="32" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">d</tspan></text><text x="240" y="532" font-family="Arial, sans-serif" font-size="28" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">−1/3</tspan></text><circle cx="380" cy="468" r="32" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><text x="380" y="478" font-family="Arial, sans-serif" font-size="32" fill="#172522" text-anchor="middle"><tspan x="380" dy="0">d</tspan></text><text x="380" y="532" font-family="Arial, sans-serif" font-size="28" fill="#172522" text-anchor="middle"><tspan x="380" dy="0">−1/3</tspan></text><text x="240" y="588" font-family="Arial, sans-serif" font-size="28" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">2/3 − 1/3 − 1/3 = 0</tspan></text><rect x="16" y="636" width="448" height="225" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="670" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="679" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">3</tspan></text><text x="76" y="680" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Это ещё не всё внутри</tspan></text><path d="M45 734 q15 -30 30 0 t30 0 t30 0" fill="none" stroke="#285b43" stroke-width="3"/><text x="167" y="743" font-family="Arial, sans-serif" font-size="28" fill="#172522" text-anchor="start"><tspan x="167" dy="0">Глюоны</tspan></text><rect x="40" y="777" width="74" height="46" rx="14" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><text x="77" y="809" font-family="Arial, sans-serif" font-size="26" fill="#172522" text-anchor="middle"><tspan x="77" dy="0">q q̄</tspan></text><text x="135" y="809" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="start"><tspan x="135" dy="0">Кварк и антикварк</tspan></text><text x="24" y="895" font-family="Arial, sans-serif" font-size="24" fill="#172522" text-anchor="start"><tspan x="24" dy="0">Схема, не фотография.</tspan></text></svg>
