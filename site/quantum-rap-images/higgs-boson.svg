<svg xmlns="http://www.w3.org/2000/svg" width="480" height="880" viewBox="0 0 480 880" role="img" aria-labelledby="title description" lang="ru" xml:lang="ru"><title id="title">От поля Хиггса к проверке в эксперименте</title><desc id="description">Верхняя линия служит аналогией поля и его возбуждения. Ни амплитуда, ни форма не являются измерениями. Средняя панель показывает две независимые проверки: ATLAS и CMS регистрируют продукты распада и сравнивают распределения многих событий с фоном. Развилка обозначает два эксперимента, а не попадание продуктов одного распада в оба детектора. Последняя панель отделяет уже открытый бозон от ещё не подтверждённых дополнительных бозонов Хиггса. Основная масса протонов и нейтронов связана с сильным взаимодействием.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#285b43" stroke-width="1.5"/></marker></defs><rect width="480" height="880" fill="#f4f1e9"/><text x="24" y="35" font-family="Arial, sans-serif" font-size="19" fill="#172522" text-anchor="start"><tspan x="24" dy="0">ORI / РИСУНОК К РАЗБОРУ</tspan></text><rect x="16" y="60" width="448" height="215" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="94" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="103" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">1</tspan></text><text x="76" y="104" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Поле и его возбуждение</tspan></text><path d="M40 181 L160 181 Q180 181 195 147 Q210 113 225 181 Q240 249 255 181 Q270 147 285 181 L440 181" fill="none" stroke="#285b43" stroke-width="4"/><text x="240" y="244" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Рябь — только аналогия.</tspan></text><rect x="16" y="293" width="448" height="300" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="327" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="336" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">2</tspan></text><text x="76" y="337" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Как обнаружили частицу</tspan></text><text x="240" y="387" font-family="Arial, sans-serif" font-size="28" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Продукты распада</tspan></text><path d="M218 405 L126 450" fill="none" stroke="#285b43" stroke-width="3" marker-end="url(#arrow)"/><path d="M262 405 L354 450" fill="none" stroke="#285b43" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="464" width="174" height="70" rx="14" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><rect x="266" y="464" width="174" height="70" rx="14" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><text x="127" y="509" font-family="Arial, sans-serif" font-size="30" fill="#172522" text-anchor="middle"><tspan x="127" dy="0">ATLAS</tspan></text><text x="353" y="509" font-family="Arial, sans-serif" font-size="30" fill="#172522" text-anchor="middle"><tspan x="353" dy="0">CMS</tspan></text><text x="240" y="567" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Независимые эксперименты</tspan></text><rect x="16" y="611" width="448" height="210" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="645" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="654" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">3</tspan></text><text x="76" y="655" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Что ещё проверяют</tspan></text><text x="240" y="711" font-family="Arial, sans-serif" font-size="28" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Другие бозоны Хиггса?</tspan><tspan x="240" dy="36.4">Пока гипотеза.</tspan></text><text x="240" y="787" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Их наличие не установлено.</tspan></text><text x="24" y="855" font-family="Arial, sans-serif" font-size="24" fill="#172522" text-anchor="start"><tspan x="24" dy="0">Схема, не фотография.</tspan></text></svg>
