<svg xmlns="http://www.w3.org/2000/svg" width="480" height="890" viewBox="0 0 480 890" role="img" aria-labelledby="title description" lang="ru" xml:lang="ru"><title id="title">Часы после двух путешествий</title><desc id="description">До полёта часы сверяют в одном месте. Один друг остаётся на Земле, второй летит и возвращается. После новой встречи можно непосредственно сравнить прошедшее время. В таком идеализированном опыте оно различается. Линии показывают два маршрута, а не график пространства-времени; длины линий и положения стрелок не задают скорость или длительность. Для каждого друга его собственные часы идут обычно.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#285b43" stroke-width="1.5"/></marker></defs><rect width="480" height="890" fill="#f4f1e9"/><text x="24" y="35" font-family="Arial, sans-serif" font-size="19" fill="#172522" text-anchor="start"><tspan x="24" dy="0">ORI / РИСУНОК К РАЗБОРУ</tspan></text><rect x="16" y="60" width="448" height="180" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="94" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="103" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">1</tspan></text><text x="76" y="104" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Встреча перед полётом</tspan></text><circle cx="90" cy="135" r="12" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M70 183 Q70 153 90 153 Q110 153 110 183" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><circle cx="180" cy="160" r="34" fill="white" stroke="#285b43" stroke-width="2"/><path d="M180 160 L180 137" fill="none" stroke="#285b43" stroke-width="3"/><path d="M180 160 L180 141" fill="none" stroke="#285b43" stroke-width="3"/><circle cx="180" cy="160" r="3" fill="#285b43" stroke="#285b43" stroke-width="2"/><circle cx="290" cy="160" r="34" fill="white" stroke="#285b43" stroke-width="2"/><path d="M290 160 L290 137" fill="none" stroke="#285b43" stroke-width="3"/><path d="M290 160 L290 141" fill="none" stroke="#285b43" stroke-width="3"/><circle cx="290" cy="160" r="3" fill="#285b43" stroke="#285b43" stroke-width="2"/><circle cx="390" cy="135" r="12" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M370 183 Q370 153 390 153 Q410 153 410 183" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><rect x="16" y="258" width="448" height="300" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="292" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="301" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">2</tspan></text><text x="76" y="302" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Два разных маршрута</tspan></text><text x="60" y="350" font-family="Arial, sans-serif" font-size="26" fill="#172522" text-anchor="start"><tspan x="60" dy="0">Земля</tspan></text><text x="280" y="350" font-family="Arial, sans-serif" font-size="26" fill="#172522" text-anchor="start"><tspan x="280" dy="0">Корабль</tspan></text><path d="M110 382 L110 478" fill="none" stroke="#285b43" stroke-width="3"/><path d="M300 382 L395 430 L300 478" fill="none" stroke="#285b43" stroke-width="3"/><circle cx="110" cy="382" r="5" fill="#285b43" stroke="#285b43" stroke-width="2"/><circle cx="110" cy="478" r="5" fill="#285b43" stroke="#285b43" stroke-width="2"/><circle cx="300" cy="382" r="5" fill="#285b43" stroke="#285b43" stroke-width="2"/><circle cx="300" cy="478" r="5" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="40" y="530" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="start"><tspan x="40" dy="0">Корабль летит и возвращается.</tspan></text><rect x="16" y="576" width="448" height="255" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="610" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="619" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">3</tspan></text><text x="76" y="620" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Встретились: сравним</tspan></text><circle cx="130" cy="680" r="34" fill="white" stroke="#285b43" stroke-width="2"/><path d="M130 680 L130 657" fill="none" stroke="#285b43" stroke-width="3"/><path d="M130 680 L149 680" fill="none" stroke="#285b43" stroke-width="3"/><circle cx="130" cy="680" r="3" fill="#285b43" stroke="#285b43" stroke-width="2"/><circle cx="350" cy="680" r="34" fill="white" stroke="#285b43" stroke-width="2"/><path d="M350 680 L350 657" fill="none" stroke="#285b43" stroke-width="3"/><path d="M350 680 L366.4544826719043 670.5" fill="none" stroke="#285b43" stroke-width="3"/><circle cx="350" cy="680" r="3" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="240" y="690" font-family="Arial, sans-serif" font-size="36" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">≠</tspan></text><text x="240" y="761" font-family="Arial, sans-serif" font-size="28" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Может пройти</tspan><tspan x="240" dy="36.4">разное время.</tspan></text><text x="24" y="865" font-family="Arial, sans-serif" font-size="24" fill="#172522" text-anchor="start"><tspan x="24" dy="0">Схема, не фотография.</tspan></text></svg>
