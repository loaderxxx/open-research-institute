<svg xmlns="http://www.w3.org/2000/svg" width="480" height="917" viewBox="0 0 480 917" role="img" aria-labelledby="title description" lang="ru" xml:lang="ru"><title id="title">Теории сознания проверяют по предсказаниям</title><desc id="description">Верхние две ветви обозначают GNWT и IIT, затем следует заранее согласованная проверка предсказаний с помощью измерений и отчётов людей. Схема не утверждает, что одна теория окончательно победила. Нижняя панель напоминает: сохранение обработки сигнала, например звука под анестезией, само по себе не доказывает субъективного опыта. Нарисованный сигнал не содержит экспериментальных данных.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#285b43" stroke-width="1.5"/></marker></defs><rect width="480" height="917" fill="#f4f1e9"/><text x="24" y="35" font-family="Arial, sans-serif" font-size="19" fill="#172522" text-anchor="start"><tspan x="24" dy="0">ORI / РИСУНОК К РАЗБОРУ</tspan></text><rect x="16" y="60" width="448" height="245" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="94" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="103" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">1</tspan></text><text x="76" y="104" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Сравним две теории</tspan></text><rect x="40" y="148" width="180" height="64" rx="14" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><rect x="260" y="148" width="180" height="64" rx="14" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><text x="130" y="190" font-family="Arial, sans-serif" font-size="28" fill="#172522" text-anchor="middle"><tspan x="130" dy="0">GNWT</tspan></text><text x="350" y="190" font-family="Arial, sans-serif" font-size="28" fill="#172522" text-anchor="middle"><tspan x="350" dy="0">IIT</tspan></text><text x="240" y="267" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Заранее: что предсказывают?</tspan></text><path d="M130 319 L215 362" fill="none" stroke="#285b43" stroke-width="3" marker-end="url(#arrow)"/><path d="M350 319 L265 362" fill="none" stroke="#285b43" stroke-width="3" marker-end="url(#arrow)"/><rect x="16" y="380" width="448" height="220" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="414" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="423" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">2</tspan></text><text x="76" y="424" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Измерения и ответы</tspan></text><circle cx="80" cy="466" r="12" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M60 514 Q60 484 80 484 Q100 484 100 514" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><path d="M120 510 L420 510" fill="none" stroke="#285b43" stroke-width="3"/><path d="M125 506 l30 0 15 -25 20 45 18 -30 25 10 30 0 18 -17 15 25 20 -8 100 0" fill="none" stroke="#285b43" stroke-width="3"/><text x="240" y="568" font-family="Arial, sans-serif" font-size="24" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Сопоставляем с предсказаниями</tspan></text><rect x="16" y="618" width="448" height="240" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="652" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="661" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">3</tspan></text><text x="76" y="662" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Поддержка и новые вопросы</tspan></text><text x="240" y="719" font-family="Arial, sans-serif" font-size="28" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Сигнал мозга</tspan><tspan x="240" dy="36.4">≠</tspan><tspan x="240" dy="36.4">доказанное переживание</tspan></text><text x="24" y="892" font-family="Arial, sans-serif" font-size="24" fill="#172522" text-anchor="start"><tspan x="24" dy="0">Схема, не фотография.</tspan></text></svg>
