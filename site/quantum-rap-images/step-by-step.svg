<svg xmlns="http://www.w3.org/2000/svg" width="480" height="865" viewBox="0 0 480 865" role="img" aria-labelledby="title description" lang="ru" xml:lang="ru"><title id="title">Верный ответ и верный способ — разные вещи</title><desc id="description">В первой панели три пакета, в каждом четыре условных яблока. Во второй галочкой отмечена верная запись четыре плюс четыре плюс четыре равно двенадцать. Крестиком отмечена неверная запись три плюс четыре равно двенадцать: правый результат подходит задаче, но равенство ложно. В третьей панели напоминание о независимой проверке проверяющего и новых задачах.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#285b43" stroke-width="1.5"/></marker></defs><rect width="480" height="865" fill="#f4f1e9"/><text x="24" y="35" font-family="Arial, sans-serif" font-size="19" fill="#172522" text-anchor="start"><tspan x="24" dy="0">ORI / РИСУНОК К РАЗБОРУ</tspan></text><rect x="16" y="60" width="448" height="250" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="94" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="103" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">1</tspan></text><text x="76" y="104" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Три пакета по 4 яблока</tspan></text><rect x="41" y="143" width="118" height="105" rx="14" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><circle cx="75" cy="173" r="12" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="123" cy="173" r="12" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="75" cy="216" r="12" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="123" cy="216" r="12" fill="white" stroke="#285b43" stroke-width="2"/><rect x="181" y="143" width="118" height="105" rx="14" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><circle cx="215" cy="173" r="12" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="263" cy="173" r="12" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="215" cy="216" r="12" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="263" cy="216" r="12" fill="white" stroke="#285b43" stroke-width="2"/><rect x="321" y="143" width="118" height="105" rx="14" fill="#e6eee5" stroke="#285b43" stroke-width="2"/><circle cx="355" cy="173" r="12" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="403" cy="173" r="12" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="355" cy="216" r="12" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="403" cy="216" r="12" fill="white" stroke="#285b43" stroke-width="2"/><text x="240" y="284" font-family="Arial, sans-serif" font-size="28" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Всего 12 яблок</tspan></text><rect x="16" y="328" width="448" height="245" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="362" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="371" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">2</tspan></text><text x="76" y="372" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Проверим способ</tspan></text><path d="M43 422 l6 7 13 -17" fill="none" stroke="#285b43" stroke-width="4"/><text x="86" y="431" font-family="Arial, sans-serif" font-size="28" fill="#172522" text-anchor="start"><tspan x="86" dy="0">4 + 4 + 4 = 12</tspan></text><path d="M43 478 L61 496" fill="none" stroke="#855029" stroke-width="3"/><path d="M43 496 L61 478" fill="none" stroke="#855029" stroke-width="3"/><text x="86" y="496" font-family="Arial, sans-serif" font-size="28" fill="#172522" text-anchor="start"><tspan x="86" dy="0">3 + 4 = 12</tspan></text><text x="240" y="541" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Итог совпал. Шаг неверен.</tspan></text><rect x="16" y="591" width="448" height="215" rx="14" fill="white" stroke="#285b43" stroke-width="2"/><circle cx="46" cy="625" r="18" fill="#285b43" stroke="#285b43" stroke-width="2"/><text x="46" y="634" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle"><tspan x="46" dy="0">3</tspan></text><text x="76" y="635" font-family="Arial, sans-serif" font-size="27" fill="#172522" text-anchor="start"><tspan x="76" dy="0">Проверка тоже не идеальна</tspan></text><text x="240" y="691" font-family="Arial, sans-serif" font-size="25" fill="#172522" text-anchor="middle"><tspan x="240" dy="0">Проверяющий может ошибиться.</tspan><tspan x="240" dy="32.5">Нужны новые задачи</tspan><tspan x="240" dy="32.5">и независимые проверки.</tspan></text><text x="24" y="840" font-family="Arial, sans-serif" font-size="24" fill="#172522" text-anchor="start"><tspan x="24" dy="0">Схема, не фотография.</tspan></text></svg>
